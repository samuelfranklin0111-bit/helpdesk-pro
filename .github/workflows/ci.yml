name: CI

# Roda a cada envio (push) e a cada pull request.
on:
  push:
  pull_request:

jobs:
  qualidade:
    name: Análise estática (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Rodar o ESLint (0 erros e 0 avisos)
        run: npm run lint

      # Os testes unitários, de integração e a cobertura serão adicionados aqui
      # quando existirem. O workflow falha se qualquer passo obrigatório falhar.
